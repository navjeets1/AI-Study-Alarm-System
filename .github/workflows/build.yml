name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download offline ML models
        run: npm run setup

      - name: Build extension
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/manifest.json
          test -f dist/sidepanel.html
          test -f dist/background.js
          test -d dist/assets
